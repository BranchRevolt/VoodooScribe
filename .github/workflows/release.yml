# Builds installers for every platform and publishes them as a draft release.
#
# Run it from the Actions tab ("Run workflow") and give it the tag to create, or
# push a v* tag. The release is left as a draft so the notes can be pasted in and
# the artifacts checked before anyone sees it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v1.0.0"
        required: true
        default: v1.0.0
      only:
        description: "Build a single platform instead of all four"
        required: false
        default: all
        type: choice
        options: [all, ubuntu-22.04, windows-2025, macos-14, macos-15-intel]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Picks the build matrix. A matrix cannot be filtered by a workflow input
  # directly — the `matrix` context is not available in a job-level `if` — so the
  # list is emitted as JSON here and consumed with fromJSON below. That makes
  # rebuilding one platform after a fix cost one runner instead of four.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only || 'all' }}
        run: |
          all='[
            {"platform":"ubuntu-22.04",   "target":"x86_64-unknown-linux-gnu", "macos_target":""},
            {"platform":"windows-2025",   "target":"x86_64-pc-windows-msvc",   "macos_target":""},
            {"platform":"macos-14",       "target":"aarch64-apple-darwin",     "macos_target":"11.0"},
            {"platform":"macos-15-intel", "target":"x86_64-apple-darwin",      "macos_target":"10.15"}
          ]'
          if [ "$ONLY" = "all" ]; then
            echo "include=$(echo "$all" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "include=$(echo "$all" | jq -c --arg p "$ONLY" '[.[] | select(.platform == $p)]')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    permissions:
      contents: write

    strategy:
      # One platform failing must not throw away the packages the others produced.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    runs-on: ${{ matrix.platform }}

    env:
      # Read by the cmake crate as CMAKE_OSX_DEPLOYMENT_TARGET. Empty on Linux and
      # Windows, where it means nothing.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's own system dependencies plus the Vulkan loader. The shader
      # compiler comes from the LunarG repository below, not from Ubuntu: the
      # `glslc` package name is not available on every Ubuntu release, and the
      # Vulkan backends of whisper.cpp and llama.cpp will not configure without it.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf cmake
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # ggml configures a helper tool (vulkan-shaders-gen) in a nested CMake run
      # that does not inherit the Visual Studio environment, so that run finds no
      # compiler and dies on "No CMAKE_CXX_COMPILER could be found". This puts the
      # MSVC variables into the job environment, where the nested run picks them up.
      - name: Set up MSVC environment
        if: matrix.platform == 'windows-2025'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Version, install path and environment variables copied from llama.cpp's
      # build-vulkan.yml: the installer lays the SDK out under a versioned
      # directory, so VULKAN_SDK has to name that directory and not its parent.
      - name: Windows Vulkan SDK
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o "$env:RUNNER_TEMP/VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      # ggml builds a helper tool (vulkan-shaders-gen) through a nested CMake run.
      # Under the Visual Studio generator that run inherits no compiler and dies on
      # "No CMAKE_CXX_COMPILER could be found"; llama.cpp's own CI therefore builds
      # with Ninja. The cmake crate has no switch for this, but it reads
      # CMAKE_GENERATOR from the environment.
      - name: Ninja generator
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          Add-Content $env:GITHUB_ENV "CMAKE_GENERATOR=Ninja"

      # The nested vulkan-shaders-gen build nests its own directories deep enough
      # that a compiler input lands at 261 characters, one past the 260 of
      # MAX_PATH, and cl.exe reports the file as missing. Building into a short
      # path keeps the whole tree 42 characters clear of the limit.
      # tauri-action reads CARGO_TARGET_DIR when it looks for the bundles
      # (src/utils.ts), so the artifacts are still found.
      - name: Short build path
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=C:\b"

      # macOS needs no GPU SDK: Metal is part of the system.

      # Below 10.15 libc++ marks the whole of std::filesystem unavailable, which is
      # what ggml-backend-reg.cpp is written against. MACOSX_DEPLOYMENT_TARGET in
      # the environment did not reach the compiler, so the value goes through a
      # toolchain file: llama.cpp passes -DCMAKE_OSX_DEPLOYMENT_TARGET explicitly,
      # and CMAKE_TOOLCHAIN_FILE is the one define the cmake crate reads from the
      # environment.
      - name: Pin the macOS deployment target
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo 'set(CMAKE_OSX_DEPLOYMENT_TARGET "${{ matrix.macos_target }}" CACHE STRING "" FORCE)' \
            > "$RUNNER_TEMP/osx-target.cmake"
          echo "CMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/osx-target.cmake" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Invoked through `bash` rather than directly: a file added through the
      # GitHub web UI is stored mode 644, with no execute bit.
      - name: Fetch FFmpeg sidecar
        if: matrix.platform != 'windows-2025'
        shell: bash
        run: bash src-tauri/binaries/fetch-ffmpeg.sh

      # Done in PowerShell rather than through fetch-ffmpeg.sh: that script picks
      # its target from `uname`, which reports MINGW64 here and matches none of its
      # cases, and it unpacks with `unzip`, which Git Bash does not always carry.
      # The archive and the sidecar name are the same ones the script uses.
      - name: Fetch FFmpeg sidecar (Windows)
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          curl.exe -L --retry 3 -o ffmpeg.zip $url
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $exe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      # Builds the frontend, compiles the Rust side and bundles the installers,
      # then creates (or reuses) the draft release and uploads them to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: VoodooScribe ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: "Artifacts built by CI. Release notes go here before publishing."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

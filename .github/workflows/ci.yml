# Checks every push and pull request on Linux only: the point is to catch broken
# code quickly, not to prove the app bundles everywhere. Packaging for all three
# platforms happens in release.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # webkit2gtk for Tauri, Vulkan headers and glslc for the whisper.cpp and
      # llama.cpp GPU backends, cmake because both are built from source.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf cmake libvulkan-dev glslc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # whisper.cpp and llama.cpp are compiled from source, which dominates the
      # run; without this cache every job pays those 20+ minutes again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build reads frontendDist at compile time, so dist/ must exist
      # before anything Rust is built. `npm run build` also runs tsc.
      - name: Build frontend
        run: npm run build

      # The sidecar is declared in tauri.conf.json; the host binary is enough for
      # a non-bundling build.
      - name: Fetch FFmpeg sidecar
        run: ./src-tauri/binaries/fetch-ffmpeg.sh

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Model-backed tests are env-gated and skip here: the GGUF and ggml files
      # are gigabytes and are not in the repository.
      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets
